const SUPABASE_ANON_KEY = '你的_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            { id: 'BK003', title: '城市觀察手帳', isbn: '9789881234563', artist: '陳大文', category: 'ZINE', type: 'consignment', price: 65, stock: 12, holdStock: 4, soldCount: 5, artistSplit: 0.65, cover: 'https://placehold.co/300x400/f1f5f9/334155?text=%E5%9F%8E%E5%B8%82%E8%A7%80%E2%BD%8B' },

            { id: 'BK007', title: '一拳閱讀誌 Vol.1', isbn: '9789881234567', artist: '一拳書館', category: '一拳書', type: 'consignment', price: 110, stock: 15, holdStock: 0, soldCount: 6, artistSplit: 0.70, cover: 'https://placehold.co/300x400/f1f5f9/334155?text=%E4%B8%80%E6%B2%B3%E6%9B%B8' }
        ];

        function App() {
  // 1. 新增用戶登入狀態
    const [user, setUser] = React.useState(null);

    // 2. 將預設值改為空陣列 []（改為等 Supabase 雲端載入資料）
    const [products, setProducts] = React.useState([]);
    const [salesLogs, setSalesLogs] = React.useState([]);
    const [holdList, setHoldList] = React.useState([]);

    const [systemMode, setSystemMode] = React.useState('pos'); 
    const [activeTab, setActiveTab] = React.useState('pos'); 
    const [selectedCategory, setSelectedCategory] = React.useState('全部');
    const [searchQuery, setSearchQuery] = React.useState('');
    
    // Cart & POS state
    const [cart, setCart] = React.useState([]);
    const [paymentMethod, setPaymentMethod] = React.useState('FPS');

    // 3. 加入 Supabase 雲端資料讀取與登入狀態監聽
    React.useEffect(() => {
        // 檢查與監聽登入狀態
        supabaseClient.auth.getSession().then(({ data: { session } }) => setUser(session?.user ?? null));
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => setUser(session?.user ?? null));

        // 向 Supabase 雲端資料庫抓取產品、銷售紀錄及 Hold 貨清單
        async function fetchCloudData() {
            const { data: pData } = await supabaseClient.from('products').select('*');
            if (pData) setProducts(pData);

            const { data: sData } = await supabaseClient.from('sales_logs').select('*');
            if (sData) setSalesLogs(sData);

            const { data: hData } = await supabaseClient.from('hold_list').select('*');
            if (hData) setHoldList(hData);
        }

        fetchCloudData();
        return () => subscription.unsubscribe();
    }, []);
            const [salesLogs, setSalesLogs] = React.useState(() => getSavedState('salesLogs', [
                { id: 'TX1001', date: '2026-03-08 14:20', items: [{ title: '一臉一詞', qty: 1, price: 120 }], total: 120, paymentMethod: 'FPS' },
                { id: 'TX1002', date: '2026-03-08 15:45', items: [{ title: '舊城記憶明信片套裝', qty: 2, price: 45 }], total: 90, paymentMethod: 'PayMe' }
            ]));

            // Hold items log state (記錄活動/市集/客人 Hold 貨備註)
            const [holdList, setHoldList] = React.useState(() => getSavedState('holdList', [
                { id: 'H001', targetName: 'Book Fair 市集展覽預留', productId: 'BK003', productTitle: '城市觀察手帳', qty: 4, date: '2026-03-08', note: '帶往活動現場銷售' },
                { id: 'H002', targetName: '黃小姐 (預留自取)', productId: 'BK005', productTitle: '舊城記憶明信片套裝', qty: 5, date: '2026-03-07', note: '門市預留至本週末' }
            ]));

            const [isNewProductModalOpen, setIsNewProductModalOpen] = React.useState(false);
            const [isHoldModalOpen, setIsHoldModalOpen] = React.useState(false);
            const [isImportModalOpen, setIsImportModalOpen] = React.useState(false);
            const [importText, setImportText] = React.useState('');
            const [editingProduct, setEditingProduct] = React.useState(null);
            const [toastMessage, setToastMessage] = React.useState('');
            const [holdFilterQuery, setHoldFilterQuery] = React.useState('');
            
            // 二次確認下架刪除狀態
            const [isDeleteConfirming, setIsDeleteConfirming] = React.useState(false);

            // Product Form state
            const [formData, setFormData] = React.useState({
                title: '',
                artist: '',
                category: '香港書',
                type: 'consignment',
                price: 100,
                stock: 10,
                holdStock: 0,
                artistSplit: 0.70,
                cover: ''
            });

            // Fast Hold Form State
            const [holdForm, setHoldForm] = React.useState({
                productId: '',
                targetName: '',
                qty: 1,
                note: ''
            });

            // Fast Stock In Form State
            const [fastStockInId, setFastStockInId] = React.useState('');
            const [fastStockInQty, setFastStockInQty] = React.useState(1);

           

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3200);
            };

            const copySettlementToClipboard = (artistName) => {
                const artistProducts = products.filter(p => p.artist === artistName);
                let message = `Hello ${artistName}！WURE TUNNEL 寄賣銷售更新：\n\n`;
                let totalPayable = 0;

                artistProducts.forEach(p => {
                    const sold = p.soldCount || 0;
                    const split = p.type === 'outright' ? 1.0 : (p.artistSplit !== undefined ? p.artistSplit : 0.70);
                    const payable = sold * p.price * split;
                    totalPayable += payable;

                    message += `《${p.title}》\n* 上期售出：${sold} 本\n* 現在尚餘寄賣量為：${p.stock} 本\n\n`;
                });

                message += `* 應結算總額：HK$ ${Math.round(totalPayable)}\n感謝支持🌟 FPS 你方便嗎？～`;

                const textarea = document.createElement('textarea');
                textarea.value = message;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast(`已複製 ${artistName} 的對賬訊息至剪貼簿！`);
                } catch (err) {
                    showToast('複製失敗，請重試');
                }
                document.body.removeChild(textarea);
            };

            const handleFastStockIn = (e) => {
                e.preventDefault();
                if (!fastStockInId) {
                    showToast('請選擇要補庫的商品');
                    return;
                }
                const qty = parseInt(fastStockInQty);
                if (isNaN(qty) || qty <= 0) {
                    showToast('請輸入有效的補貨數量');
                    return;
                }

                setProducts(prev => prev.map(p => {
                    if (p.id === fastStockInId) {
                        return { ...p, stock: p.stock + qty };
                    }
                    return p;
                }));

                const prod = products.find(p => p.id === fastStockInId);
                showToast(`已成功為《${prod?.title || ''}》補貨 ${qty} 本！`);
                setFastStockInId('');
                setFastStockInQty(1);
            };

            const handleAddHoldStock = async (e) => { // 👈 1. 加上 async
    e.preventDefault();
    if (!holdForm.productId) {
        showToast('請選擇要 Hold 貨預留的書籍');
        return;
    }
    const qty = parseInt(holdForm.qty);
    if (isNaN(qty) || qty <= 0) {
        showToast('請輸入有效的 Hold 貨數量');
        return;
    }

    const targetProd = products.find(p => p.id === holdForm.productId);
    if (!targetProd) return;

    const currentAvailable = targetProd.stock - (targetProd.holdStock || 0);
    if (qty > currentAvailable) {
        showToast(`預留數量 (${qty}) 不能超過現有門市可售庫存 (${currentAvailable})`);
        return;
    }

    // 更新產品 Hold 庫存
    setProducts(prev => prev.map(p => {
        if (p.id === holdForm.productId) {
            return { ...p, holdStock: (p.holdStock || 0) + qty };
        }
        return p;
    }));

    // 新增 Hold 紀錄
    const nowStr = new Date().toISOString().split('T')[0];
    const newHoldItem = {
        id: 'H' + Math.floor(100 + Math.random() * 900),
        targetName: holdForm.targetName || 'Book Fair / 市集活動預留',
        productId: targetProd.id,
        productTitle: targetProd.title,
        qty: qty,
        date: nowStr,
        note: holdForm.note || '市集/活動展覽預留'
    };

    // 👈 2. 新增：將 Hold 貨紀錄寫入 Supabase
    await supabaseClient.from('hold_list').insert([newHoldItem]);

    setHoldList(prev => [newHoldItem, ...prev]);
    showToast(`已成功預留《${targetProd.title}》 ${qty} 本（${newHoldItem.targetName}）！`);
    setIsHoldModalOpen(false);
    setHoldForm({ productId: '', targetName: '', qty: 1, note: '' });
};

            // 釋放 Hold 貨 (取消預留，歸還門市可售)
            const handleReleaseHold = (holdItem) => {
                setProducts(prev => prev.map(p => {
                    if (p.id === holdItem.productId) {
                        const newHold = Math.max(0, (p.holdStock || 0) - holdItem.qty);
                        return { ...p, holdStock: newHold };
                    }
                    return p;
                }));
                setHoldList(prev => prev.filter(h => h.id !== holdItem.id));
                showToast(`已釋放《${holdItem.productTitle}》的 ${holdItem.qty} 本預留，回歸門市可售庫存！`);
            };

            // 將 Hold 貨直接轉為售出 (如市集現場賣出或客人完成交收)
            const handleConvertHoldToSale = (holdItem) => {
                const prod = products.find(p => p.id === holdItem.productId);
                if (!prod) return;

                setProducts(prev => prev.map(p => {
                    if (p.id === holdItem.productId) {
                        return {
                            ...p,
                            stock: Math.max(0, p.stock - holdItem.qty),
                            holdStock: Math.max(0, (p.holdStock || 0) - holdItem.qty),
                            soldCount: (p.soldCount || 0) + holdItem.qty
                        };
                    }
                    return p;
                }));

                const nowStr = new Date().toLocaleString('zh-HK', { hour12: false }).replace(/\//g, '-');
                const saleTotal = prod.price * holdItem.qty;
                const newLog = {
                    id: 'TX-HOLD-' + Math.floor(1000 + Math.random() * 9000),
                    date: nowStr,
                    items: [{ title: `${prod.title} (Hold預留轉售: ${holdItem.targetName})`, qty: holdItem.qty, price: prod.price }],
                    total: saleTotal,
                    paymentMethod: '市集/預留交收 (Event Sale)'
                };

                setSalesLogs(prev => [newLog, ...prev]);
                setHoldList(prev => prev.filter(h => h.id !== holdItem.id));
                showToast(`已成功將《${holdItem.productTitle}》x${holdItem.qty} 本轉為已售，完成結帳紀錄！`);
            };

            const uniqueArtists = React.useMemo(() => {
                const artists = products.map(p => p.artist).filter(Boolean);
                return Array.from(new Set(artists));
            }, [products]);

            const filteredProducts = React.useMemo(() => {
                return products.filter(p => {
                    const matchesCat = selectedCategory === '全部' || p.category === selectedCategory;
                    const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          p.artist.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          (p.isbn && p.isbn.includes(searchQuery)) ||
                                          p.id.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCat && matchesSearch;
                });
            }, [products, selectedCategory, searchQuery]);

            const filteredHoldList = React.useMemo(() => {
                if (!holdFilterQuery.trim()) return holdList;
                const q = holdFilterQuery.toLowerCase();
                return holdList.filter(h => 
                    h.productTitle.toLowerCase().includes(q) || 
                    h.targetName.toLowerCase().includes(q) ||
                    (h.note && h.note.toLowerCase().includes(q))
                );
            }, [holdList, holdFilterQuery]);

            const addToCart = (product) => {
                const availStock = product.stock - (product.holdStock || 0);
                if (availStock <= 0) {
                    showToast('該書籍目前無門市可售庫存（已售罄或被活動/市集 Hold 貨預留）');
                    return;
                }

                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        if (existing.qty >= availStock) {
                            showToast(`已達門市可售上限 (${availStock} 本，已扣除活動 Hold 貨)`);
                            return prev;
                        }
                        return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    }
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const updateCartQty = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.qty + delta;
                        const product = products.find(p => p.id === id);
                        const availStock = product ? (product.stock - (product.holdStock || 0)) : 0;
                        if (newQty <= 0) return null;
                        if (newQty > availStock) {
                            showToast(`已超過門市可售庫存 (${availStock} 本)`);
                            return item;
                        }
                        return { ...item, qty: newQty };
                    }
                    return item;
                }).filter(Boolean));
            };

const handleCheckout = async () => { // 👈 1. 加上 async
    if (cart.length === 0) return;
    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const nowStr = new Date().toLocaleString('zh-HK', { hour12: false }).replace(/\//g, '-');
    
    const newLog = {
        id: 'TX' + Math.floor(100000 + Math.random() * 900000),
        date: nowStr,
        items: cart.map(c => ({ title: c.title, qty: c.qty, price: c.price })),
        total: total,
        paymentMethod: paymentMethod
    };

    // 👈 2. 新增：將銷售紀錄寫入 Supabase
    await supabaseClient.from('sales_logs').insert([newLog]);

    setProducts(prev => prev.map(p => {
        const cartItem = cart.find(c => c.id === p.id);
        if (cartItem) {
            return {
                ...p,
                stock: Math.max(0, p.stock - cartItem.qty),
                soldCount: (p.soldCount || 0) + cartItem.qty
            };
        }
        return p;
    }));

    setSalesLogs(prev => [newLog, ...prev]);
    setCart([]);
    showToast(`已成功完成結帳！總額: HK$ ${total} (${paymentMethod})`);
};

            const openNewProductModal = () => {
                setFormData({
                    title: '',
                    artist: '',
                    category: '香港書',
                    type: 'consignment',
                    price: 100,
                    stock: 10,
                    holdStock: 0,
                    artistSplit: 0.70,
                    cover: ''
                });
                setEditingProduct(null);
                setIsDeleteConfirming(false);
                setIsNewProductModalOpen(true);
            };

            const openEditProductModal = (product) => {
                setEditingProduct(product);
                setFormData({
                    title: product.title || '',
                    artist: product.artist || '',
                    category: product.category || '香港書',
                    type: product.type || 'consignment',
                    price: product.price || 0,
                    stock: product.stock || 0,
                    holdStock: product.holdStock || 0,
                    artistSplit: product.artistSplit !== undefined ? product.artistSplit : 0.70,
                    cover: product.cover || ''
                });
                setIsDeleteConfirming(false);
                setIsNewProductModalOpen(true);
            };

            // 安全刪除與下架處理
            const handleDeleteProduct = () => {
                if (!editingProduct) return;
                const delTitle = editingProduct.title;
                setProducts(prev => prev.filter(p => p.id !== editingProduct.id));
                // 同時清理掉該商品的 Hold 貨紀錄
                setHoldList(prev => prev.filter(h => h.productId !== editingProduct.id));
                setIsNewProductModalOpen(false);
                setEditingProduct(null);
                setIsDeleteConfirming(false);
                showToast(`已安全下架並刪除《${delTitle}》！`);
            };

const handleSaveProduct = async (e) => { // 👈 1. 加上 async
    e.preventDefault();
    if (!formData.title || !formData.artist) {
        showToast('請填寫書籍名稱與創作者/作者');
        return;
    }

    if (formData.holdStock > formData.stock) {
        showToast(`Hold 貨預留量 (${formData.holdStock}) 不能大於總庫存 (${formData.stock})`);
        return;
    }

    if (editingProduct) {
        // 👈 2. 新增：更新 Supabase 資料庫中的舊書籍
        await supabaseClient.from('products').update(formData).eq('id', editingProduct.id);

        setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...p, ...formData } : p));
        showToast('已成功更新舊貨品資料');
    } else {
        const newProd = {
            id: 'BK' + String(products.length + 1).padStart(3, '0'),
            ...formData,
            holdStock: formData.holdStock || 0,
            soldCount: 0,
            cover: formData.cover || 'https://placehold.co/300x400/f1f5f9/334155?text=' + encodeURIComponent(formData.title || '新書')
        };

        // 👈 3. 新增：將新書籍資料寫入 Supabase
        await supabaseClient.from('products').insert([newProd]);

        setProducts(prev => [newProd, ...prev]);
        showToast('新書籍已成功建檔');
    }
    setIsNewProductModalOpen(false);
};

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData(prev => ({ ...prev, cover: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleCSVImport = () => {
                if (!importText.trim()) return;
                const lines = importText.trim().split('\n');
                const newProds = [];

                                            value={holdForm.productId}
                                            onChange={e => setHoldForm({ ...holdForm, productId: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 font-bold focus:outline-none focus:border-slate-900"
                                        >
                                            <option value="">-- 請選擇書籍 --</option>
                                            {products.map(p => {
                                                const avail = p.stock - (p.holdStock || 0);
                                                return (
                                                    <option key={p.id} value={p.id} disabled={avail <= 0}>
                                                        {p.title} ({p.artist}) - 可售剩餘: {avail} 本
                                                    </option>
                                                );
                                            })}
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">預留用途 / 市集名稱 / 客人姓名 *</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="例如：Book Fair 展覽現場 / 黃小姐預留"
                                            value={holdForm.targetName}
                                            onChange={e => setHoldForm({ ...holdForm, targetName: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 font-bold focus:outline-none focus:border-slate-900"
                                        />
                                    </div>

                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">預留數量 *</label>
                                        <input 
                                            type="number" 
                                            min="1"
                                            required
                                            value={holdForm.qty}
                                            onChange={e => setHoldForm({ ...holdForm, qty: parseInt(e.target.value) || 1 })}
                                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 font-mono font-bold focus:outline-none focus:border-slate-900"
                                        />
                                    </div>

                                    <div>
                                        <label class="block font-bold text-slate-700 mb-1">備註說明</label>
                                        <input 
                                            type="text" 
                                            placeholder="例如：帶往現場販售，預計下週展期結束"
                                            value={holdForm.note}
                                            onChange={e => setHoldForm({ ...holdForm, note: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 font-medium focus:outline-none focus:border-slate-900"
                                        />
                                    </div>

                                    <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsHoldModalOpen(false)}
                                            class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl"
                                        >
                                            取消
                                        </button>
                                        <button 
                                            type="submit" 
                                            class="px-5 py-2 bg-slate-900 hover:bg-black text-white font-bold text-xs rounded-xl shadow-xs"
                                        >
                                            確認新增 Hold 貨
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* CSV IMPORT MODAL */}
                    {isImportModalOpen && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
                            <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
                                <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                                    <h3 class="font-black text-base text-slate-900">批次 CSV 數據匯入</h3>
                                    <button onClick={() => setIsImportModalOpen(false)} class="text-slate-400 hover:text-slate-800 font-bold">✕</button>
                                </div>

                                <div class="space-y-3 pt-4 text-xs">
                                    <p class="text-slate-500">格式：書名, 作者, 分類, 售價, 庫存, Hold貨量, 模式(寄賣/買斷)</p>
                                    <textarea 
                                        rows="6"
                                        value={importText}
                                        onChange={e => setImportText(e.target.value)}
                                        placeholder={`一臉一詞, Apple Wong, 香港書, 120, 10, 0, 寄賣\n城市觀察, 陳大文, ZINE, 65, 15, 2, 買斷`}
                                        class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-900 font-mono text-xs focus:outline-none focus:border-slate-900"
                                    ></textarea>

                                    <div class="flex items-center justify-end gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsImportModalOpen(false)}
                                            class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl"
                                        >
                                            取消
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={handleCSVImport}
                                            class="px-5 py-2 bg-slate-900 hover:bg-black text-white font-bold rounded-xl shadow-xs"
                                        >
                                            開始匯入
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
