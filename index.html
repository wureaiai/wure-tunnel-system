<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WURE TUNNEL - 書庫與寄賣管理系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'neutral-surface': '#fcfcfc',
              'neutral-card': '#ffffff',
              'brand-dark': '#0f172a',
              'brand-muted': '#64748b',
              'brand-light': '#f1f5f9',
              'brand-border': '#e2e8f0',
            }
          }
        }
      }
    </script>
    <!-- React, ReactDOM, Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 🟢 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
      body { 
        font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: #fafafa;
        color: #0f172a;
        user-select: none;
        letter-spacing: -0.01em;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #fafafa; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50/70 text-slate-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // 🟢 Supabase 初始化（請替換為你的網址與 Key）
        const SUPABASE_URL = 'https://rtbxswkbwedbfuufzljo.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0Ynhzd2tid2VkYmZ1dWZ6bGpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzc3NzgsImV4cCI6MjEwNDk1Mzc3OH0.zKyVILh1gvgpgArxjL2ZBm8WfhkR6Eb08lt9CnQdRwc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const FIXED_QUICK_KEYS = ['全部', '香港人製', '香港書', '台灣書', '一拳書', 'ZINE', '明信片', '貼紙', 'Tee', '其他'];
        const CATEGORIES_INPUT = ['香港人製', '香港書', '台灣書', '一拳書', 'ZINE', '明信片', '貼紙', 'Tee', '其他'];

        const INITIAL_PRODUCTS = [
            { id: 'BK001', title: '一臉一詞', isbn: '9789881234561', artist: 'Apple Wong', category: '香港書', type: 'consignment', price: 120, stock: 7, holdStock: 0, soldCount: 2, artistSplit: 0.70, cover: 'https://placehold.co/300x400/f1f5f9/334155?text=%E4%B8%80%E8%87%89%E4%B8%80%E8%A9%9E' }
        ];

        function App() {
            // 🟢 User state
            const [user, setUser] = React.useState(null);

            const [products, setProducts] = React.useState(INITIAL_PRODUCTS);
            const [systemMode, setSystemMode] = React.useState('pos'); 
            const [activeTab, setActiveTab] = React.useState('pos'); 
            const [selectedCategory, setSelectedCategory] = React.useState('全部');
            const [searchQuery, setSearchQuery] = React.useState('');
            
            const [cart, setCart] = React.useState([]);
            const [paymentMethod, setPaymentMethod] = React.useState('FPS');
            const [salesLogs, setSalesLogs] = React.useState([]);
            const [holdList, setHoldList] = React.useState([]);

            const [isNewProductModalOpen, setIsNewProductModalOpen] = React.useState(false);
            const [isHoldModalOpen, setIsHoldModalOpen] = React.useState(false);
            const [isImportModalOpen, setIsImportModalOpen] = React.useState(false);
            const [importText, setImportText] = React.useState('');
            const [editingProduct, setEditingProduct] = React.useState(null);
            const [toastMessage, setToastMessage] = React.useState('');
            const [holdFilterQuery, setHoldFilterQuery] = React.useState('');
            const [isDeleteConfirming, setIsDeleteConfirming] = React.useState(false);

            // Product Form state
            const [formData, setFormData] = React.useState({
                title: '', artist: '', category: '香港書', type: 'consignment', price: 100, stock: 10, holdStock: 0, artistSplit: 0.70, cover: ''
            });

            // Fast Hold Form State
            const [holdForm, setHoldForm] = React.useState({ productId: '', targetName: '', qty: 1, note: '' });
            const [fastStockInId, setFastStockInId] = React.useState('');
            const [fastStockInQty, setFastStockInQty] = React.useState(1);

            // 🟢 從 Supabase 載入資料 & 檢查 Session
            React.useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? null);
                });

                async function loadData() {
                    const { data: pData } = await supabase.from('products').select('*');
                    if (pData && pData.length > 0) setProducts(pData);

                    const { data: sData } = await supabase.from('sales_logs').select('*');
                    if (sData && sData.length > 0) setSalesLogs(sData);

                    const { data: hData } = await supabase.from('hold_list').select('*');
                    if (hData && hData.length > 0) setHoldList(hData);
                }

                loadData();

                return () => subscription.unsubscribe();
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3200);
            };

            // 🟢 登入 / 登出 Handler
            const handleGoogleLogin = async () => {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.href }
                });
                if (error) showToast('登入失敗: ' + error.message);
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setUser(null);
                showToast('已成功登出');
            };

            // 結帳邏輯 (寫入 Supabase)
            const handleCheckout = async () => {
                if (cart.length === 0) return;
                const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
                const nowStr = new Date().toLocaleString('zh-HK', { hour12: false }).replace(/\//g, '-');
                
                const newLog = {
                    id: 'TX' + Math.floor(100000 + Math.random() * 900000),
                    date: nowStr,
                    items: cart.map(c => ({ title: c.title, qty: c.qty, price: c.price })),
                    total: total,
                    payment_method: paymentMethod,
                    cashier_email: user?.email || '未知店員'
                };

                const { error } = await supabase.from('sales_logs').insert([newLog]);
                if (error) {
                    showToast('結帳雲端同步失敗: ' + error.message);
                    return;
                }

                setProducts(prev => prev.map(p => {
                    const cartItem = cart.find(c => c.id === p.id);
                    if (cartItem) {
                        return { ...p, stock: Math.max(0, p.stock - cartItem.qty), soldCount: (p.soldCount || 0) + cartItem.qty };
                    }
                    return p;
                }));

                setSalesLogs(prev => [newLog, ...prev]);
                setCart([]);
                showToast(`已成功收款結帳！總額: HK$ ${total} (${paymentMethod})`);
            };

            const uniqueArtists = React.useMemo(() => Array.from(new Set(products.map(p => p.artist).filter(Boolean))), [products]);

            const filteredProducts = React.useMemo(() => {
                return products.filter(p => {
                    const matchesCat = selectedCategory === '全部' || p.category === selectedCategory;
                    const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          p.artist.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          (p.isbn && p.isbn.includes(searchQuery)) ||
                                          p.id.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCat && matchesSearch;
                });
            }, [products, selectedCategory, searchQuery]);

            const addToCart = (product) => {
                const availStock = product.stock - (product.holdStock || 0);
                if (availStock <= 0) {
                    showToast('該書籍目前無門市可售庫存');
                    return;
                }
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        if (existing.qty >= availStock) {
                            showToast(`已達可售上限 (${availStock} 本)`);
                            return prev;
                        }
                        return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    }
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const updateCartQty = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.qty + delta;
                        const product = products.find(p => p.id === id);
                        const availStock = product ? (product.stock - (product.holdStock || 0)) : 0;
                        if (newQty <= 0) return null;
                        if (newQty > availStock) return item;
                        return { ...item, qty: newQty };
                    }
                    return item;
                }).filter(Boolean));
            };

            const openNewProductModal = () => {
                setFormData({ title: '', artist: '', category: '香港書', type: 'consignment', price: 100, stock: 10, holdStock: 0, artistSplit: 0.70, cover: '' });
                setEditingProduct(null);
                setIsDeleteConfirming(false);
                setIsNewProductModalOpen(true);
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!formData.title || !formData.artist) {
                    showToast('請填寫書籍名稱與創作者/作者');
                    return;
                }

                if (editingProduct) {
                    const { error } = await supabase.from('products').update(formData).eq('id', editingProduct.id);
                    if (!error) {
                        setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...p, ...formData } : p));
                        showToast('已成功更新舊貨品資料');
                    } else {
                        showToast('更新失敗: ' + error.message);
                    }
                } else {
                    const newProd = {
                        id: 'BK' + String(products.length + 1).padStart(3, '0'),
                        ...formData,
                        holdStock: formData.holdStock || 0,
                        soldCount: 0,
                        cover: formData.cover || 'https://placehold.co/300x400/f1f5f9/334155?text=' + encodeURIComponent(formData.title || '新書')
                    };
                    const { error } = await supabase.from('products').insert([newProd]);
                    if (!error) {
                        setProducts(prev => [newProd, ...prev]);
                        showToast('新書籍已成功建檔並上傳至雲端');
                    } else {
                        showToast('上傳失敗: ' + error.message);
                    }
                }
                setIsNewProductModalOpen(false);
            };

            return (
                <div class="flex flex-col min-h-screen bg-slate-50 text-slate-800 font-sans tracking-tight">
                    {toastMessage && (
                        <div class="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-xs font-medium flex items-center gap-2.5 animate-fadeIn">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* TOP HEADER */}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
                        <div class="max-w-7xl mx-auto px-5 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3">
                            <div class="flex items-center gap-3.5">
                                <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white font-black text-xs tracking-wider shadow-xs">WT</div>
                                <div>
                                    <h1 class="text-base font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                                        WURE TUNNEL <span class="text-[10px] uppercase font-mono tracking-wider px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 border border-slate-200 font-bold">System</span>
                                    </h1>
                                    <p class="text-[11px] text-slate-500 font-medium">書庫與寄賣管理系統 • POS & Settlement</p>
                                </div>
                            </div>

                            {/* 🟢 Action Buttons with Google Login / Logout */}
                            <div class="flex items-center gap-2">
                                {user ? (
                                    <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                                        <span class="text-xs font-bold text-slate-700">{user.email}</span>
                                        <button onClick={handleLogout} class="px-2.5 py-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-[11px] rounded-lg transition-all">
                                            登出
                                        </button>
                                    </div>
                                ) : (
                                    <button onClick={handleGoogleLogin} class="px-3.5 py-2 bg-slate-900 hover:bg-black text-white font-bold text-xs rounded-xl shadow-xs transition-all flex items-center gap-1.5 active:scale-95">
                                        <span>🔑 Google 登入</span>
                                    </button>
                                )}

                                <button onClick={openNewProductModal} class="px-4 py-2 bg-slate-900 hover:bg-black text-white font-bold text-xs rounded-xl shadow-xs transition-all flex items-center gap-1.5 active:scale-95">
                                    <span>+ 新書籍增加</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            {/* Left Product List */}
                            <div class="lg:col-span-8 space-y-4">
                                <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-xs space-y-3">
                                    <input 
                                        type="text" 
                                        placeholder="搜尋書名、創作者或條碼 ISBN..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-slate-900 font-medium"
                                    />
                                </div>

                                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5">
                                    {filteredProducts.map(product => (
                                        <div key={product.id} onClick={() => addToCart(product)} class="bg-white border rounded-2xl p-3 flex flex-col justify-between cursor-pointer transition-all hover:shadow-md border-slate-200">
                                            <div>
                                                <h3 class="font-bold text-xs text-slate-900">{product.title}</h3>
                                                <p class="text-[11px] text-slate-500 mt-0.5">{product.artist}</p>
                                            </div>
                                            <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-slate-100">
                                                <span class="text-xs font-black text-slate-900 font-mono">HK$ {product.price}</span>
                                                <span class="text-[10px] px-1.5 py-0.5 rounded font-mono font-bold bg-slate-100 text-slate-700">存 {product.stock}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Right Cart */}
                            <div class="lg:col-span-4">
                                <div class="bg-white rounded-2xl border border-slate-200/90 shadow-xs p-4 sticky top-20 flex flex-col h-[calc(100vh-110px)]">
                                    <h2 class="font-black text-slate-900 text-sm tracking-tight border-b pb-3">門市結帳購物車</h2>
                                    <div class="flex-1 overflow-y-auto py-3 space-y-2">
                                        {cart.map(item => (
                                            <div key={item.id} class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex items-center justify-between">
                                                <div>
                                                    <div class="font-bold text-xs text-slate-900">{item.title}</div>
                                                    <div class="text-[11px] text-slate-500 font-mono">HK$ {item.price} x {item.qty}</div>
                                                </div>
                                                <div class="flex items-center gap-1.5">
                                                    <button onClick={() => updateCartQty(item.id, -1)} class="w-5 h-5 bg-slate-200 font-bold text-xs rounded">-</button>
                                                    <span class="text-xs font-bold font-mono">{item.qty}</span>
                                                    <button onClick={() => updateCartQty(item.id, 1)} class="w-5 h-5 bg-slate-200 font-bold text-xs rounded">+</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div class="border-t pt-3 space-y-3">
                                        <div class="flex justify-between text-sm font-black">
                                            <span>總計金額</span>
                                            <span class="font-mono">HK$ {cart.reduce((sum, item) => sum + item.price * item.qty, 0)}</span>
                                        </div>
                                        <button onClick={handleCheckout} disabled={cart.length === 0} class="w-full py-2.5 bg-slate-900 hover:bg-black text-white font-bold rounded-xl text-xs disabled:opacity-50">
                                            確認收款結帳
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
